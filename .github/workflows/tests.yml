name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Jasmine spec files/globs to run instead of the full unit + spec suites'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        node_version: ['lts/*', 'node', '14']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Filtered Tests
        if: ${{ inputs.test-filter != '' }}
        run: npm test -- ${{ inputs.test-filter }}
      - name: Run Unit Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:specs
      - name: Build and Pack
        if: ${{ matrix.node_version == '14' }}
        env:
          MARKED_BUILD_YEAR: '2021'
        run: |
          npm run build
          npm pack
      - name: Upload Package
        if: ${{ matrix.node_version == '14' }}
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
          if-no-files-found: error

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
